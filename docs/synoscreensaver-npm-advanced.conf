# ---------------------------------------------------------------------------
#  Public access for the Android TV app - paste into the "Advanced" tab of the
#  Nginx Proxy Manager proxy host for synoscreensaver.mkulik.eu
#
#  The DiskStation is NOT exposed. The TV app uses exactly six WebAPI calls, so
#  everything else - the DSM web UI, File Station, the login page, the package
#  centre - is refused here. What remains reachable is a read-only photo API.
#
#  Proxy host settings to use alongside this:
#      Forward Hostname / IP : 192.168.69.157
#      Forward Port          : 5001
#      Block Common Exploits : on
#      Websockets Support    : off
#  (The upstream values are ignored by the locations below, which address the
#   NAS directly, but NPM requires them to be filled in.)
# ---------------------------------------------------------------------------

# 1. Refuse every path except the two WebAPI scripts.
#    This runs in the server rewrite phase, before any location is chosen, so
#    it also covers the "location /" that NPM generates.
#    The ACME challenge is excluded, otherwise certificate renewal would break.
if ($request_uri !~ "^/(\.well-known/acme-challenge/|webapi/(entry|query)\.cgi\?)") {
    return 404;
}

# 2. Nothing here uploads, and the app only ever reads.
if ($request_method !~ ^(GET|HEAD)$) {
    return 405;
}

# 3. entry.cgi - only the six APIs the app calls.
#    A missing api= parameter, or any other one, is refused.
location = /webapi/entry.cgi {
    if ($arg_api !~ ^(SYNO\.API\.Auth|SYNO\.API\.Encryption|SYNO\.Foto\.Browse\.Album|SYNO\.Foto\.Browse\.Item|SYNO\.Foto\.Download)$) {
        return 403;
    }

    proxy_pass https://192.168.69.157:5001$request_uri;
    proxy_ssl_server_name on;
    # The certificate is issued for *.mkulik.eu while we connect by IP, so the
    # hostname cannot be verified. The hop is inside the LAN.
    proxy_ssl_verify off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Never cache: these answers carry a session id and change per user.
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;

    proxy_connect_timeout 15s;
    proxy_send_timeout 120s;
    # Image downloads stream straight through rather than buffering to disk.
    proxy_read_timeout 120s;
    proxy_buffering off;
    client_max_body_size 1m;
}

# 4. query.cgi - only the API discovery call.
location = /webapi/query.cgi {
    if ($arg_api != "SYNO.API.Info") {
        return 403;
    }

    proxy_pass https://192.168.69.157:5001$request_uri;
    proxy_ssl_server_name on;
    proxy_ssl_verify off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;

    proxy_connect_timeout 15s;
    proxy_read_timeout 30s;
}
